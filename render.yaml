services:
  # 1. Backend REST API (Render Web Service)
  - type: web
    name: taw-api
    runtime: docker
    dockerfilePath: Dockerfile.api
    plan: starter
    region: frankfurt
    preDeployCommand: npx prisma migrate deploy --schema=./apps/api/prisma/schema.prisma
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOT_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_DISCUSSION_GROUP_ID
        sync: false
      - key: RUN_EMBEDDED_BOT
        value: "true"
      - key: API_BASE_URL
        value: "https://taw-api-y52z.onrender.com"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: "Platform Super Admin"
