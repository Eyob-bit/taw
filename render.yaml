services:
  # 1. Backend REST API
  - type: web
    name: taw-api
    runtime: docker
    dockerfilePath: Dockerfile.api
    plan: starter
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taw-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taw-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BOT_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_DISCUSSION_GROUP_ID
        sync: false

  # 2. Telegram Bot Background Worker
  - type: worker
    name: taw-bot
    runtime: docker
    dockerfilePath: Dockerfile.bot
    plan: starter
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taw-postgres
          property: connectionString
      - key: API_BASE_URL
        value: https://taw-api.onrender.com/api
      - key: BOT_API_KEY
        fromService:
          type: web
          name: taw-api
          envVarKey: BOT_API_KEY
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_DISCUSSION_GROUP_ID
        sync: false

databases:
  - name: taw-postgres
    plan: starter
    region: frankfurt
    databaseName: relationship_platform
    user: postgres
